<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>배구 스코어보드 LIVE</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#151d2e;--line:#2c3950;--text:#f5f8ff;--muted:#aab8ca;--blue:#2684ff;--red:#f04452;--green:#44d7a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:#25324a;color:var(--text)}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#2279ec;color:white}.danger{background:#6c2936}.surface{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:850}.hint{color:var(--muted);font-size:13px}.card{border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:14px 0}.field label{display:block;font-weight:730;margin:0 0 8px}.field input,.field select{display:block;width:100%;background:#0c1422;color:var(--text);border:1px solid #3c4b65;border-radius:10px;padding:12px}.options{display:flex;gap:8px;flex-wrap:wrap}.option.active{background:#2279ec}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.hidden{display:none!important}.pill{border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13px;color:#d5e2f2}.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(95px,.48fr) minmax(0,1fr);gap:12px;margin:18px 0}.team{border-radius:19px;background:var(--panel);padding:20px 12px;text-align:center;overflow:hidden}.team.blue{border-top:5px solid var(--blue)}.team.red{border-top:5px solid var(--red)}.name{font-weight:850;font-size:clamp(18px,3.7vw,41px);overflow-wrap:anywhere}.score{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(75px,15vw,190px);line-height:1.15;letter-spacing:-.055em}.setsbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.setcount{font-weight:850;font-size:clamp(32px,6vw,72px);font-variant-numeric:tabular-nums;white-space:nowrap}.scores{width:100%;border-collapse:separate;border-spacing:5px;font-variant-numeric:tabular-nums;text-align:center;table-layout:fixed}.scores th{color:var(--muted);font-size:13px}.scores td{background:#222f45;border-radius:8px;padding:12px 3px;font-weight:850;font-size:clamp(17px,2.5vw,29px)}.scores td.namecell{text-align:left;overflow-wrap:anywhere;font-size:clamp(13px,2vw,22px);padding:12px 8px}.scores .wina{color:#79b4ff}.scores .winb{color:#ff8790}.scores .current{outline:2px solid #e5f0ff}.banner{text-align:center;background:#213954;padding:12px;border-radius:12px;font-weight:850}.pointcontrols{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin:14px 0 0}.pointcontrols button{font-size:22px;min-height:63px}.pointcontrols .plus.a{background:var(--blue)}.pointcontrols .plus.b{background:var(--red)}.code{font-weight:900;font-size:clamp(24px,4vw,42px);letter-spacing:.12em;user-select:all}.connect{max-width:680px}.buttonrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.role-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.role-buttons button{padding:25px 12px;font-size:18px}.small{font-size:12px;color:var(--muted)}.controller .score{font-size:clamp(68px,13vw,135px)}.controller .team{padding:14px 9px}.controller .name{font-size:clamp(17px,3vw,28px)}.big-buttons button{min-height:85px;font-size:32px}.tv .surface{max-width:none;padding:2vw}.tv .board{min-height:53vh}.tv .score{font-size:clamp(100px,21vw,340px)}.tv .name{font-size:clamp(25px,5vw,85px)}.tv .setcount{font-size:clamp(44px,7vw,116px)}.tv .scores td{font-size:clamp(20px,3vw,48px);padding:18px 5px}.tv .scores .namecell{font-size:clamp(20px,2.5vw,42px)}.tv .top{padding:5px 0}.tv .card{margin:8px 0}.notice{background:#583e18;color:#ffe2a1;border-radius:10px;padding:12px;font-size:13px;margin-top:10px}@media(max-width:540px){.surface{padding:12px}.card{padding:14px}.board{grid-template-columns:minmax(0,1fr) 66px minmax(0,1fr);gap:5px}.team{padding:13px 5px}.score{font-size:clamp(52px,14vw,78px)}.setcount{font-size:29px}.pointcontrols button{min-height:60px}.scores{border-spacing:3px}.scores td{padding:10px 2px}.grid{grid-template-columns:1fr}.role-buttons button{font-size:15px}}
</style></head><body>
<div class="surface" id="root">
 <header class="top"><div><div class="eyebrow">VOLLEYBALL LIVE</div><h1 style="margin:3px 0;font-size:clamp(19px,3vw,30px)">배구 스코어보드</h1></div><div class="row"><span id="connection" class="pill">연결 대기</span><button id="home" class="hidden">처음으로</button></div></header>
 <section id="intro" class="card connect" style="margin:22px auto"><h2>어떻게 사용하시겠어요?</h2><p class="hint">TV에서는 전광판을 열고, 휴대전화에서는 조작기를 엽니다.</p><div class="role-buttons"><button class="primary" id="choose-tv">📺 TV · 전광판</button><button id="choose-phone">📱 휴대전화 · 점수 조작</button></div><p class="small">두 기기 모두 인터넷이 연결되어 있어야 합니다. TV에서 발급된 경기 코드를 휴대전화에 입력하세요.</p></section>
 <section id="setup" class="card connect hidden" style="margin:20px auto"><h2 style="margin-top:0">경기 설정</h2><div class="grid"><div class="field"><label for="name-a">청팀 이름</label><input id="name-a" maxlength="26" value="청팀"></div><div class="field"><label for="name-b">홍팀 이름</label><input id="name-b" maxlength="26" value="홍팀"></div></div><div class="grid"><div class="field"><label for="target">목표 점수</label><select id="target"><option>15</option><option>21</option><option selected>25</option><option>30</option><option value="custom">직접 입력</option></select><input class="hidden" type="number" min="1" max="99" value="20" id="custom" style="margin-top:8px"></div><div class="field"><label for="maxsets">총 세트 수</label><select id="maxsets"><option value="1">1세트 단판</option><option value="3">3세트 2선승제</option><option value="5" selected>5세트 3선승제</option></select></div></div><div class="field"><label class="row"><input id="deuce" type="checkbox" checked style="width:auto"> 2점 차 승리 (듀스) 적용</label></div><div class="field"><label class="row"><input id="final15" type="checkbox" checked style="width:auto"> 최종 세트는 15점으로 변경 (3·5세트 경기)</label></div><button class="primary" id="start-host">전광판 열고 경기 코드 만들기</button></section>
 <section id="join" class="card connect hidden" style="margin:20px auto"><h2 style="margin-top:0">휴대전화 조작기 연결</h2><p class="hint">TV 화면에 표시된 영문·숫자 6자리 경기 코드를 입력하세요.</p><div class="field"><label for="joincode">경기 코드</label><input id="joincode" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="예: V7K2Q9" style="text-transform:uppercase;font-size:25px;font-weight:800;letter-spacing:.12em"></div><button class="primary" id="join-btn">TV 점수판에 연결</button><div id="join-error" class="notice hidden"></div></section>
 <section id="live" class="hidden">
 <div class="row spread" style="margin:14px 0"><div class="row"><span id="role-status" class="pill"></span><span id="roomcode" class="code"></span></div><div class="row"><button id="share" class="hidden">연결 링크 복사</button><button id="fullscreen">전체 화면</button></div></div>
 <div id="peer-info" class="small"></div>
 <div class="board"><section class="team blue"><div id="team-a" class="name">청팀</div><div id="score-a" class="score">0</div><div id="controls-a" class="pointcontrols hidden"><button data-side="0" data-delta="-1">−</button><button class="plus a" data-side="0" data-delta="1">+1</button></div></section><div class="setsbox"><div class="eyebrow">SETS</div><div id="set-count" class="setcount">0 : 0</div><div id="set-label" class="hint">1세트</div><div id="target-label" class="small">25점</div></div><section class="team red"><div id="team-b" class="name">홍팀</div><div id="score-b" class="score">0</div><div id="controls-b" class="pointcontrols hidden"><button data-side="1" data-delta="-1">−</button><button class="plus b" data-side="1" data-delta="1">+1</button></div></section></div>
 <div id="winner-banner" class="banner hidden"></div>
 <section class="card"><div class="row spread"><b>세트별 점수 현황</b><span id="rules" class="small"></span></div><div style="overflow-x:auto;margin-top:12px"><table id="history-table" class="scores"></table></div></section>
 <section id="controls-footer" class="card hidden"><div class="row spread"><div class="row"><button id="undo">↶ 되돌리기</button><button id="new">새 경기</button></div><button id="next" class="primary hidden">다음 세트 →</button></div></section>
 </section>
</div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),sections=['intro','setup','join','live'];let role=null,peer=null,conn=null,guests=[],state=null,undos=[],room=null,joinTimeout=null;const show=id=>sections.forEach(s=>$(s).classList.toggle('hidden',id!==s));const status=t=>$('connection').textContent=t;const code=()=>Array.from(crypto.getRandomValues(new Uint8Array(6))).map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');const peerId=x=>'vblive-26-'+x.toLowerCase();function clone(v){return JSON.parse(JSON.stringify(v));}
function cleanup(){if(conn){try{conn.close()}catch{}}conn=null;guests.forEach(c=>{try{c.close()}catch{}});guests=[];if(peer){try{peer.destroy()}catch{}}peer=null;clearTimeout(joinTimeout);}
function reset(){cleanup();role=null;state=null;undos=[];room=null;document.body.classList.remove('tv','controller');$('home').classList.add('hidden');show('intro');status('연결 대기');}
function target(i){return state.rules.last15&&state.rules.maxsets>1&&i===state.rules.maxsets-1?15:state.rules.target;}function setWinner(s,i){if(Math.max(...s)<target(i))return -1;if(state.rules.deuce&&Math.abs(s[0]-s[1])<2)return -1;return s[0]===s[1]?-1:(s[0]>s[1]?0:1);}
function counts(){let c=[0,0];state.scores.forEach((s,i)=>{let w=setWinner(s,i);if(w!==-1)c[w]++});return c}function matchWinner(){return counts().findIndex(x=>x>=Math.floor(state.rules.maxsets/2)+1)}
function teamAt(position){return state.index%2===0?position:1-position;}function render(){if(!state)return;const i=state.index,s=state.scores[i],w=setWinner(s,i),mw=matchWinner(),c=counts();const left=teamAt(0),right=teamAt(1);$('team-a').textContent=state.names[left];$('team-b').textContent=state.names[right];$('score-a').textContent=s[left];$('score-b').textContent=s[right];$('set-count').textContent=c[left]+' : '+c[right];$('set-label').textContent=(i+1)+'세트'+(i>0?' · 코트 교대':'');$('target-label').textContent=target(i)+'점'+(state.rules.deuce?' · 2점 차':'');$('rules').textContent=state.rules.maxsets+'세트 · '+(Math.floor(state.rules.maxsets/2)+1)+'선승';$('winner-banner').classList.toggle('hidden',w===-1);if(w!==-1)$('winner-banner').textContent=state.names[mw===-1?w:mw]+(mw===-1?' 세트 승리':' 경기 최종 승리!');$('next').classList.toggle('hidden',w===-1||mw!==-1);$('undo').disabled=undos.length===0;document.querySelectorAll('[data-side]').forEach(b=>{const side=teamAt(Number(b.dataset.side)),delta=Number(b.dataset.delta);b.disabled=w!==-1||mw!==-1||(delta<0&&s[side]===0)});
let tbl=$('history-table');tbl.replaceChildren();const trh=document.createElement('tr');['팀',...Array.from({length:state.rules.maxsets},(_,j)=>(j+1)+'세트')].forEach(v=>{let e=document.createElement('th');e.textContent=v;trh.append(e)});tbl.append(trh);for(let position=0;position<2;position++){const side=teamAt(position);let row=document.createElement('tr');let n=document.createElement('td');n.className='namecell';n.textContent=state.names[side];row.append(n);for(let j=0;j<state.rules.maxsets;j++){let td=document.createElement('td'),ss=state.scores[j];td.textContent=ss?ss[side]:'–';if(ss&&setWinner(ss,j)===side)td.classList.add(side===0?'wina':'winb');if(j===i&&w===-1)td.classList.add('current');row.append(td)}tbl.append(row)}
}
function broadcast(){render();guests=guests.filter(g=>g.open);for(const g of guests){try{g.send({type:'state',state})}catch{}}}function change(position,delta){if(role!=='host'||!state)return;const side=teamAt(position),s=state.scores[state.index];if(setWinner(s,state.index)!==-1||(delta<0&&s[side]===0))return;undos.push(clone(state));if(undos.length>500)undos.shift();s[side]+=delta;broadcast()};function next(){if(role!=='host'||!state||matchWinner()!==-1||setWinner(state.scores[state.index],state.index)===-1||state.index+1>=state.rules.maxsets)return;undos.push(clone(state));state.index++;state.scores.push([0,0]);broadcast()}function undo(){if(role!=='host'||!undos.length)return;state=undos.pop();broadcast()}
function host(){if(typeof Peer==='undefined'){alert('인터넷 연결 또는 연결 라이브러리 로딩을 확인하세요.');return;}const v=$('target').value==='custom'?Number($('custom').value):Number($('target').value);if(!Number.isInteger(v)||v<1||v>99){alert('목표 점수는 1~99 사이 정수로 설정하세요.');return;}cleanup();role='host';state={names:[$('name-a').value.trim()||'청팀',$('name-b').value.trim()||'홍팀'],rules:{target:v,maxsets:Number($('maxsets').value),deuce:$('deuce').checked,last15:$('final15').checked},index:0,scores:[[0,0]]};undos=[];room=code();document.body.classList.add('tv');$('role-status').textContent='📺 전광판';$('roomcode').textContent=room;$('roomcode').title='휴대전화에서 입력할 경기 코드';$('peer-info').textContent='휴대전화에서 같은 웹페이지를 열고 코드 '+room+' 입력 · TV 화면의 점수는 연결된 조작기에서 변경';$('controls-a').classList.add('hidden');$('controls-b').classList.add('hidden');$('controls-footer').classList.add('hidden');$('share').classList.remove('hidden');$('home').classList.remove('hidden');show('live');status('경기 연결 준비');render();const startPeer=()=>{peer=new Peer(peerId(room),{debug:0});peer.on('open',()=>status('조작기 연결 대기'));peer.on('connection',g=>{guests.push(g);g.on('open',()=>{g.send({type:'state',state});status('조작기 연결됨 ('+guests.filter(x=>x.open).length+')')});g.on('data',data=>{if(!data||typeof data!=='object')return;switch(data.type){case 'point':if(Number.isInteger(data.side)&&[0,1].includes(data.side)&&[-1,1].includes(data.delta))change(data.side,data.delta);break;case 'undo':undo();break;case 'next':next();break;case 'reset':break;case 'sync':g.send({type:'state',state});break;}});g.on('close',()=>status('조작기 연결 '+guests.filter(x=>x.open).length+'대'));g.on('error',()=>{});});peer.on('error',e=>{if(e.type==='unavailable-id'){room=code();$('roomcode').textContent=room;try{peer.destroy()}catch{}startPeer();}else status('연결 오류: '+(e.type||'네트워크'))});peer.on('disconnected',()=>{status('재연결 중');if(!peer.destroyed)peer.reconnect()})};startPeer();}
function join(){if(typeof Peer==='undefined'){$('join-error').textContent='연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.';$('join-error').classList.remove('hidden');return;}const id=$('joincode').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(id)){$('join-error').textContent='TV에 표시된 6자리 코드를 입력하세요.';$('join-error').classList.remove('hidden');return;}cleanup();role='phone';room=id;$('join-error').classList.add('hidden');status('연결 중');peer=new Peer({debug:0});peer.on('open',()=>{conn=peer.connect(peerId(room),{reliable:true});conn.on('open',()=>{status('TV 연결됨');conn.send({type:'sync'})});conn.on('data',data=>{if(data&&data.type==='state'&&data.state){state=data.state;document.body.classList.add('controller');$('roomcode').textContent=room;$('role-status').textContent='📱 조작기';$('peer-info').textContent='TV와 연결됨 · 코드 '+room;$('controls-a').classList.remove('hidden');$('controls-b').classList.remove('hidden');$('controls-footer').classList.remove('hidden');$('next').classList.remove('hidden');$('share').classList.add('hidden');$('home').classList.remove('hidden');show('live');render();$('undo').disabled=false;}});conn.on('close',()=>status('연결 끊김 · 새로 연결 필요'));conn.on('error',()=>status('연결 오류'));});peer.on('error',e=>{status('연결 실패');$('join-error').textContent='TV 코드 또는 인터넷 연결을 확인하고 다시 시도하세요. ('+(e.type||'오류')+')';$('join-error').classList.remove('hidden');if(!state)show('join')});joinTimeout=setTimeout(()=>{if(!state){$('join-error').textContent='TV가 켜져 있고 같은 코드를 사용하는지 확인하세요.';$('join-error').classList.remove('hidden');}},13000);}
function send(cmd){if(role==='host'){if(cmd.type==='point')change(cmd.side,cmd.delta);else if(cmd.type==='next')next();else if(cmd.type==='undo')undo();return;}if(conn&&conn.open)conn.send(cmd);else alert('TV 연결이 끊겼습니다. 다시 연결하세요.');}
$('choose-tv').onclick=()=>{show('setup');$('home').classList.remove('hidden')};$('choose-phone').onclick=()=>{show('join');$('home').classList.remove('hidden')};$('home').onclick=()=>{if(state&&!confirm('현재 화면을 닫고 처음으로 돌아갈까요? TV를 닫으면 조작기 연결도 끊어집니다.'))return;reset()};$('start-host').onclick=host;$('join-btn').onclick=join;$('target').onchange=()=>$('custom').classList.toggle('hidden',$('target').value!=='custom');$('joincode').onkeydown=e=>{if(e.key==='Enter')join()};document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>send({type:'point',side:Number(b.dataset.side),delta:Number(b.dataset.delta)}));$('undo').onclick=()=>send({type:'undo'});$('next').onclick=()=>send({type:'next'});$('new').onclick=()=>{if(!confirm('새 경기를 시작할까요? 기존 점수는 지워집니다.'))return;if(role==='host'){reset();show('setup');$('home').classList.remove('hidden')}else alert('새 경기는 TV 화면에서 시작해 주세요.')};$('fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};$('share').onclick=async()=>{let url=new URL(location.href);url.search='';url.hash='';const value=url.toString()+'?room='+room;try{await navigator.clipboard.writeText(value);$('share').textContent='복사 완료'}catch{prompt('조작기 연결 주소를 복사하세요',value)}};
const prefill=new URLSearchParams(location.search).get('room');if(prefill&&/^[A-Z2-9]{6}$/i.test(prefill)){show('join');$('home').classList.remove('hidden');$('joincode').value=prefill.toUpperCase()}
})();
</script></body></html>
